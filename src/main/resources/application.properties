# Local settings live in an untracked .env file (see .env.example).
# Real environment variables (Docker, CI) take precedence over the file.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:employee_service}
spring.datasource.username=${DB_USER:employee_app}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}

# API documentation: /swagger-ui.html and /v3/api-docs. Set API_DOCS_ENABLED=false to hide them.
springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:true}
springdoc.default-produces-media-type=application/json
springdoc.override-with-generic-response=false
springdoc.swagger-ui.operations-sorter=method
