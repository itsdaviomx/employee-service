# Local settings live in an untracked .env file (see .env.example).
# Real environment variables (Docker, CI) take precedence over the file.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:employee_service}
spring.datasource.username=${DB_USER:employee_app}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}

# Fail fast when MySQL is unreachable: getting a pooled connection or opening a new one waits at most 2 s.
# There is no read timeout on purpose: waiting for a row lock is normal and ends in 409 if it takes too long.
spring.datasource.hikari.connection-timeout=2000
spring.datasource.hikari.data-source-properties.connectTimeout=2000

# Unknown routes also reach ApiExceptionHandler and answer with the API error format.
# Static resources are off; springdoc registers its own handler for the Swagger UI.
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# Validate the JSON tokens before binding them to typed request fields.
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.mapper.allow-coercion-of-scalars=false
spring.jackson.deserialization.fail-on-trailing-tokens=true

# API documentation: /swagger-ui.html and /v3/api-docs. Set API_DOCS_ENABLED=false to hide them.
springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:true}
springdoc.default-produces-media-type=application/json
springdoc.override-with-generic-response=false
springdoc.swagger-ui.operations-sorter=method

# Logging. Levels and file can be overridden per environment without rebuilding.
logging.level.root=INFO
logging.level.com.employee.employeeservice=${LOG_LEVEL:INFO}
logging.level.org.hibernate.SQL=${SQL_LOG_LEVEL:WARN}
logging.pattern.dateformat=yyyy-MM-dd'T'HH:mm:ss.SSSXXX
# Every line written while serving a request carries its correlation ID (X-Correlation-Id).
logging.pattern.level=%5p [%X{correlationId:-}]
logging.file.name=${LOG_FILE:logs/employee-service.log}
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.total-size-cap=100MB

# Health checks. Only /actuator/health is exposed and it never shows component details.
# Liveness: is the process alive? Readiness: can it serve traffic? Only readiness depends on MySQL,
# so a database outage stops traffic without making the orchestrator restart the container.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db

# API users (HTTP Basic). Passwords come only from the environment: without them the service does not start.
app.security.admin.username=${API_ADMIN_USER:admin}
app.security.admin.password=${API_ADMIN_PASSWORD}
app.security.reader.username=${API_READER_USER:reader}
app.security.reader.password=${API_READER_PASSWORD}
